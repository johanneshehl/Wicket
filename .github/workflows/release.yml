name: Release

# Push a tag like v1.0.0 to build the multi-arch image and create the GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wicket
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # "[required]" or "[min-version 1.4.0]" in the tag message marks the release for the update check
      - id: flags
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          msg="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          if echo "$msg" | grep -qi '\[required\]'; then
            echo "required=<!-- wicket:required -->" >> "$GITHUB_OUTPUT"
            echo "notice=**Required update.** Older versions lock their admin interface until they are updated." >> "$GITHUB_OUTPUT"
          fi
          min="$(echo "$msg" | grep -oiE '\[min-version v?[0-9]+\.[0-9]+\.[0-9]+\]' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ -n "$min" ]; then
            echo "min=<!-- wicket:min-version $min -->" >> "$GITHUB_OUTPUT"
            echo "minnotice=**Versions below $min must update.** Their admin interface is locked until then." >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ${{ steps.flags.outputs.required }}
            ${{ steps.flags.outputs.min }}
            ${{ steps.flags.outputs.notice }}
            ${{ steps.flags.outputs.minnotice }}

            ## Docker image

            ```
            docker pull ghcr.io/${{ github.repository_owner }}/wicket:${{ github.ref_name }}
            ```

            Multi-arch image for `linux/amd64` and `linux/arm64`. See the README for setup instructions.
