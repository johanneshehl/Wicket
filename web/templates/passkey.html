{{define "passkey-icon"}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M3 20c0-3.3 2.7-6 6-6 1.2 0 2.3.3 3.2.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="17.5" cy="14.5" r="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M17.5 17v4l1.5-1.2M17.5 19.5l1.3.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>{{end}}

{{/* Sign-in button, hidden until passkey.js finds a browser that supports passkeys. */}}
{{define "passkey-login"}}<div class="pk-wrap" data-pk-wrap hidden>
  {{if not .Providers}}<div class="oauth-or"><span>{{.T "oauth.or"}}</span></div>{{end}}
  <button type="button" class="pk-login" data-passkey-login data-rd="{{.RD}}" data-failed="{{.T "passkey.failed"}}" data-cancelled="{{.T "passkey.cancelled"}}">{{template "passkey-icon"}}<span>{{.T "passkey.signin"}}</span></button>
</div>{{end}}

{{/* Add a passkey to the signed-in account. */}}
{{define "passkey-register"}}<div data-pk-wrap hidden>
  <button type="button" class="btn-ghost" data-passkey-register data-done="{{.T "passkey.added"}}" data-failed="{{.T "passkey.failed"}}" data-cancelled="{{.T "passkey.cancelled"}}">{{template "passkey-icon"}}<span>{{.T "passkey.add"}}</span></button>
</div>{{end}}
