{{define "head"}}<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.Title}} · Wicket</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/wicket.css">
</head>{{end}}

{{define "logo"}}<svg class="logo" width="{{.}}" height="{{.}}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.5"/><path d="M9 21v-7a3 3 0 016 0v7" stroke="currentColor" stroke-width="1.5"/></svg>{{end}}

{{define "footer"}}<footer class="protected">{{template "logo" 12}}<span>Geschützt von Wicket</span></footer>{{end}}

{{define "steps"}}<div class="steps">
  <div class="s"><span class="n done"><svg width="9" height="9" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Passwort</div>
  <div class="bar"></div>
  <div class="s on"><span class="n">2</span>Bestätigen</div>
</div>{{end}}

{{define "otp"}}<div class="otp" data-otp>
  <input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Ziffer 1">
  <input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Ziffer 2">
  <input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Ziffer 3">
  <span class="sep">–</span>
  <input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Ziffer 4">
  <input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Ziffer 5">
  <input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Ziffer 6">
  <input type="hidden" name="code">
</div>{{end}}
