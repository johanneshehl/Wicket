<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wicket</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/wicket.css">
</head>
<body>
<header class="app-head">
  <div class="app-bar">
    <a class="brand" href="#/">
      <svg class="logo" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.6"/><path d="M9 21v-7a3 3 0 016 0v7" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>wicket</span>
    </a>
    <span class="slash">/</span>
    <span class="muted" id="domainLabel"></span>
    <div class="right app-user">
      <button class="avatar" id="avatarBtn" type="button" aria-haspopup="true" data-i18n-label="menu.account"></button>
      <div class="menu" id="userMenu" hidden>
        <div class="menu-head" id="menuHead"></div>
        <a href="#/settings/account" data-i18n="menu.account">My account</a>
        <a href="/logout" data-i18n="menu.signout">Sign out</a>
      </div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#/" data-tab="" data-i18n="nav.overview">Overview</a>
    <a href="#/sites" data-tab="sites" data-i18n="nav.sites">Sites</a>
    <a href="#/users" data-tab="users" data-i18n="nav.users">Users</a>
    <a href="#/groups" data-tab="groups" data-i18n="nav.groups">Groups</a>
    <a href="#/templates" data-tab="templates" data-i18n="nav.templates">Templates</a>
    <a href="#/log" data-tab="log" data-i18n="nav.log">Log</a>
    <a href="#/settings" data-tab="settings" data-i18n="nav.settings">Settings</a>
  </nav>
</header>
<main id="view"></main>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/i18n.js"></script>
<script src="/static/i18n_ext.js"></script>
<script src="/static/passkey.js"></script>
<script src="/static/admin.js"></script>
<script src="/static/admin_ext.js"></script>
</body>
</html>
